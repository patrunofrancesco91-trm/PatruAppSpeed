<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c8102e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Patruno Speed Team</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brandWrap">
      <img class="brandLogo" src="assets/logo.png" alt="Patruno Speed Team">
      <div class="brandText">
        <h1>Patruno Speed Team</h1>
        <p>Performance Monitoring App · Velocità & Ostacoli</p>
      </div>
    </div>
    <div id="headerUser" class="headerUser hidden"></div>
  </header>

  <main>
    <section id="authView" class="authWrap">
      <div class="card authCard">
        <div class="authBrand">
          <img src="assets/logo.png" alt="Patruno Speed Team">
          <h2>Accedi</h2>
          <p class="muted">Speed · Data · Progress</p>
        </div>
        <p class="muted">Usa l'account assegnato dall'allenatore.</p>
        <form id="loginForm">
          <label>Email<input id="loginEmail" type="email" required autocomplete="email"></label>
          <label>Password<input id="loginPassword" type="password" required autocomplete="current-password"></label>
          <button class="primary full">Accedi</button>
        </form>
        <p id="authMsg" class="msg"></p>
      </div>
    </section>

    <section id="appView" class="hidden">
      <nav id="tabs" class="tabs"></nav>
      <section id="view"></section>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
