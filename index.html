<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c8102e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Patruno Speed Team</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brandWrap">
      <svg class="pstLogoSvg" viewBox="0 0 520 120" role="img" aria-label="Patruno Speed Team">
  <defs>
    <linearGradient id="pstRed" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3344"/>
      <stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
  </defs>
  <g transform="translate(8,10)">
    <path d="M8 74 C34 20, 92 2, 138 16 C111 18, 79 32, 62 56 C89 40, 125 36, 153 44 C116 51, 83 68, 59 95 Z" fill="url(#pstRed)"/>
    <path d="M112 20 C126 14,140 15,148 24 C156 34,151 47,139 52 C126 56,112 48,108 37 C105 30,106 24,112 20Z" fill="#fff"/>
    <path d="M139 52 C163 57,182 67,197 82 L184 97 C166 82,150 75,132 72 Z" fill="#fff"/>
    <path d="M128 61 L100 87 L85 76 L111 48 Z" fill="#fff"/>
    <path d="M151 67 L171 48 L184 58 L165 82 Z" fill="#fff"/>
  </g>
  <text x="220" y="54" fill="#fff" font-size="39" font-weight="900" font-family="Arial, Helvetica, sans-serif" font-style="italic">PATRUNO</text>
  <text x="222" y="92" fill="#ff3344" font-size="31" font-weight="900" font-family="Arial, Helvetica, sans-serif" font-style="italic">SPEED TEAM</text>
</svg>
      <div class="brandText">
        <h1>Patruno Speed Team</h1>
        <p>Performance Monitoring App · Velocità & Ostacoli</p>
      </div>
    </div>
    <div id="headerUser" class="headerUser hidden"></div>
  </header>

  <main>
    <section id="authView" class="authWrap">
      <div class="card authCard">
        <div class="authBrand">
          <svg class="pstLogoSvg" viewBox="0 0 520 120" role="img" aria-label="Patruno Speed Team">
  <defs>
    <linearGradient id="pstRed" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3344"/>
      <stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
  </defs>
  <g transform="translate(8,10)">
    <path d="M8 74 C34 20, 92 2, 138 16 C111 18, 79 32, 62 56 C89 40, 125 36, 153 44 C116 51, 83 68, 59 95 Z" fill="url(#pstRed)"/>
    <path d="M112 20 C126 14,140 15,148 24 C156 34,151 47,139 52 C126 56,112 48,108 37 C105 30,106 24,112 20Z" fill="#fff"/>
    <path d="M139 52 C163 57,182 67,197 82 L184 97 C166 82,150 75,132 72 Z" fill="#fff"/>
    <path d="M128 61 L100 87 L85 76 L111 48 Z" fill="#fff"/>
    <path d="M151 67 L171 48 L184 58 L165 82 Z" fill="#fff"/>
  </g>
  <text x="220" y="54" fill="#fff" font-size="39" font-weight="900" font-family="Arial, Helvetica, sans-serif" font-style="italic">PATRUNO</text>
  <text x="222" y="92" fill="#ff3344" font-size="31" font-weight="900" font-family="Arial, Helvetica, sans-serif" font-style="italic">SPEED TEAM</text>
</svg>
          <h2>Accedi</h2>
          <p class="muted">Speed · Data · Progress</p>
        </div>
        <p class="muted">Usa l'account assegnato dall'allenatore.</p>
        <form id="loginForm">
          <label>Email<input id="loginEmail" type="email" required autocomplete="email"></label>
          <label>Password<input id="loginPassword" type="password" required autocomplete="current-password"></label>
          <button class="primary full">Accedi</button>
        </form>
        <p id="authMsg" class="msg"></p>
      </div>
    </section>

    <section id="appView" class="hidden">
      <nav id="tabs" class="tabs"></nav>
      <section id="view"></section>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
